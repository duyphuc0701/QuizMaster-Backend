<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Join Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="card">

        <div id="loginScreen">
            <h2>🎮 Join Game</h2>
            <input type="text" id="inputPin" placeholder="Game PIN">
            <input type="text" id="inputNick" placeholder="Your Nickname">
            <button id="btnJoin">Enter Lobby</button>
            <p id="errorMsg" class="error-msg"></p>
        </div>

        <div id="lobbyScreen" class="hidden">
            <h3>Welcome, <span id="displayNick"></span>!</h3>
            <p class="info-label" style="text-align:center;">Waiting for host to start...</p>

            <div id="playerGrid"></div>

            <p style="font-size:0.8em; color:#888; margin-top:20px;">
                Players: <span id="playerCount">0</span>
            </p>
        </div>

        <div id="playerGameScreen" class="hidden">
            <h1>🚀 GO!</h1>
            <p>Look at the host screen for the question.</p>
        </div>
        <div id="playerGameOverScreen" class="hidden">
            <h1>🏁 Game Finished</h1>
            <p>Check the host screen for the winner!</p>
            <button onclick="location.reload()">Leave</button>
        </div>

    </div>

    <script src="js/stomp-client.js"></script>
    <script src="js/game-logic.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
